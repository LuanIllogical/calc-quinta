<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Quinta-Feira</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="box">

        <div id="auth">
            <h3>Login / Registrar</h3>
            <input id="user" placeholder="Nome de usuário">
            <input id="pass" type="password" placeholder="Senha">

            <button id="btnRegister">Registrar</button>
            <button id="btnLogin">Login</button>
        </div>

        <div id="app" style="display:none">

            <div class="calc">
                <input class="result" id="display" readonly>

                <div class="grid">
                    <button data-value="^">^</button>
                    <button id="sqrt">√</button>
                    <button data-value="(">(</button>
                    <button data-value=")">)</button>

                    <button id="log">log</button>
                    <button id="clear">C</button>
                    <button id="backspace">⌫</button>
                    <button data-value="/">/</button>

                    <button data-value="7">7</button>
                    <button data-value="8">8</button>
                    <button data-value="9">9</button>
                    <button data-value="*">*</button>

                    <button data-value="4">4</button>
                    <button data-value="5">5</button>
                    <button data-value="6">6</button>
                    <button data-value="-">-</button>

                    <button data-value="1">1</button>
                    <button data-value="2">2</button>
                    <button data-value="3">3</button>
                    <button data-value="+">+</button>

                    <button data-value=".">.</button>
                    <button data-value="0">0</button>
                    <button id="calcBtn" class="equals">=</button>
                </div>
            </div>

            <h4>History</h4>
            <div id="historydiv" class="history-div"></div>
            <button id="logoutBtn">Sair</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
