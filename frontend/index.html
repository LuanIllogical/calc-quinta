<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Quinta-Feira</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="box">
        <div id="auth">
            <h3>Login / Registrar</h3>
            <input id="user" placeholder="Nome de usuário">
            <input id="pass" type="password" placeholder="Senha">
            <input id="institution" placeholder="Instituição">
            <input id="education" placeholder="Escolaridade">
            <input id="address" placeholder="Endereço">
                
            <button id="btnRegister">Registrar</button><button id="btnLogin">Login</button>
        </div>
        <div id="app" style="display:none">
            <div class="user-info">
                <h4>Dados do Usuário</h4>
                <p>Usuário:<span id="profileUser"></span></p>
                <p>Instituição:<span id="profileInstitution"></span></p>
                <p>Escolaridade:<span id="profileEducation"></span></p>
                <p>Endereço:<span id="profileAddress"></span></p>
                <p>Plano:<span id="profilePlan"></span></p>
                <p>Utilizações:<span id="profileUsage"></span></p>
                <button id="btnUpgrade" style="display:none">Tornar-se Plano Pago</button>
            </div>
            <div class="calc">
                <div id="planInfo" class="plan-info">
                    <span id="planInfoText"></span>
                </div>
                <input class="result" id="display" readonly>
                <div class="grid">
                    <button data-value="^">^</button>
                    <button id="sqrt">√</button>
                    <button id="nthRoot">n√</button>
                    <button data-value=",">,</button>
                    <button data-value="(">(</button>
                    <button data-value=")">)</button>
                    <button id="clear">C</button>
                    <button id="backspace">⌫</button>
                    <button data-value="/">/</button>
                    <button data-value="7">7</button>
                    <button data-value="8">8</button>
                    <button data-value="9">9</button>
                    <button data-value="*">*</button>
                    <button data-value="4">4</button>
                    <button data-value="5">5</button>
                    <button data-value="6">6</button>
                    <button data-value="-">-</button>
                    <button data-value="1">1</button>
                    <button data-value="2">2</button>
                    <button data-value="3">3</button>
                    <button data-value="+">+</button>
                    <button data-value=".">.</button>
                    <button data-value="0">0</button>
                    <button id="calcBtn" class="equals">=</button>
                </div>
            </div>
            <h4>Ranking de Operações</h4>
            <div id="rankingdiv" class="history-div"></div>
            <h4>Histórico</h4>
            <div id="historydiv" class="history-div"></div>
            <button id="logoutBtn">
                Sair
            </button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
